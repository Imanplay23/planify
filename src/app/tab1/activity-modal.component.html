<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" color="medium">
        Cancelar
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar Actividad' : 'Nueva Actividad' }}</ion-title>
    <ion-buttons slot="end">
      @if (isEditMode) {
        <ion-button (click)="confirmDelete()" [disabled]="isLoading || isDeleting" color="danger">
          @if (isDeleting) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          }
        </ion-button>
      }
      <ion-button (click)="save()" [disabled]="activityForm.invalid || isLoading || isDeleting" [strong]="true" color="primary">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Guardar
        }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="activityForm" (ngSubmit)="save()">
    <ion-list lines="none">
      <!-- Título -->
      <ion-item class="form-item">
        <ion-input
          label="Título *"
          labelPlacement="stacked"
          placeholder="Ej: Reunión con cliente"
          formControlName="title"
          [clearInput]="true"
        ></ion-input>
      </ion-item>

      <!-- Fecha -->
      <ion-item class="form-item">
        <ion-input
          label="Fecha *"
          labelPlacement="stacked"
          type="date"
          formControlName="date"
        ></ion-input>
      </ion-item>

      <!-- Horas de Inicio y Fin -->
      <div class="time-row">
        <ion-item class="form-item time-item">
          <ion-input
            label="Hora de inicio *"
            labelPlacement="stacked"
            type="time"
            formControlName="startTime"
          ></ion-input>
        </ion-item>

        <ion-item class="form-item time-item">
          <ion-input
            label="Hora de fin *"
            labelPlacement="stacked"
            type="time"
            formControlName="endTime"
          ></ion-input>
        </ion-item>
      </div>

      <!-- Descripción -->
      <ion-item class="form-item">
        <ion-textarea
          label="Descripción (opcional)"
          labelPlacement="stacked"
          placeholder="Notas o detalles adicionales..."
          formControlName="description"
          [autoGrow]="true"
          rows="3"
        ></ion-textarea>
      </ion-item>

      <!-- Selector de color -->
      <div class="color-picker-item form-item">
        <p class="color-picker-label">Color</p>
        <div class="color-swatch-row">
          @for (color of colorOptions; track color) {
            <button
              type="button"
              class="color-swatch"
              [style.background-color]="color"
              [class.selected]="activityForm.get('color')?.value === color"
              (click)="seleccionarColor(color)"
              [attr.aria-label]="'Elegir color ' + color"
            >
              @if (activityForm.get('color')?.value === color) {
                <ion-icon name="checkmark-outline"></ion-icon>
              }
            </button>
          }
        </div>
      </div>

      <!-- Alerta / Notificación -->
      <ion-item class="form-item toggle-item">
        <ion-toggle formControlName="hasAlert" justify="space-between">
          Activar recordatorio / alerta
        </ion-toggle>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
